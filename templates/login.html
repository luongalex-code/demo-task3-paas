<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập quản trị | Lương Triều Dĩ</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page-width notes-page">
    <div class="auth-shell">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark" aria-hidden="true">TDM</span>
        <span class="brand-text"><strong>ĐẠI HỌC THỦ DẦU MỘT</strong><span>Website Profile Sinh viên</span></span>
      </a>
      <section class="profile-card notes-panel" aria-labelledby="login-title">
        <div class="section-heading notes-heading">
          <h1 id="login-title">Đăng nhập quản trị</h1>
          <p class="notes-muted">Quản lý ghi chú học tập</p>
        </div>
        {% if error %}<p class="notes-alert" role="alert">{{ error }}</p>{% endif %}
        {% if not blocked %}
        <form class="notes-form" action="{{ url_for('auth.login') }}" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <label for="username">Tên đăng nhập</label>
          <input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" required>
          <label for="password">Mật khẩu</label>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
          <div class="notes-actions"><button class="button button-primary" type="submit">Đăng nhập</button></div>
        </form>
        {% endif %}
      </section>
      <a class="notes-edit" href="{{ url_for('notes.index') }}">Về trang ghi chú</a>
    </div>
  </main>
</body>
</html>
